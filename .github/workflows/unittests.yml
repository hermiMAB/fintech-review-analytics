name: Unit Tests

on:
  push:
    branches: [ "main", "task-2" ]
  pull_request:
    branches: [ "main", "task-2" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # The NLTK downloader requires an explicit cache path configuration to match local environments
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install core and testing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn nltk huggingface_hub python-dotenv

    # Inject your environment secret explicitly into the runner's shell environment
    - name: Execute automated unit test suite
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python -m unittest discover -s tests -p "test_*.py"